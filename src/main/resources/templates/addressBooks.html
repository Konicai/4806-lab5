<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AddressBooks</title>
    <link rel="stylesheet" th:href="@{/css/addressBooks.css}" />
</head>
<body>

<h1>Address Books</h1>
<div th:each="book : ${books}" >

    <!-- Header with AddressBook ID -->
    <h2  th:text="|Address Book ${book.getId()}|" >Address Book 1</h2>

    <!-- Table with BuddyInfos of book -->
    <table>
        <caption th:text="|${book.getName() ?: ''}|">MyAddressBook</caption>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone Number</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="info : ${book.getInfo()}">
            <td th:text="${info.getId()}">MyID</td>
            <td th:text="${info.getName()}">MyName</td>
            <td th:text="${info.getPhoneNumber()}">MyPhoneNumber</td>
        </tr>
        <tr th:if="${#lists.isEmpty(book.getInfo)}">
            <td colspan="3">No entries yet.</td>
        </tr>
        </tbody>
    </table>

</div>

<h1>All Info Entries</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone Number</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="info : ${infoEntries}">
        <td th:text="${info.getId()}">MyID</td>
        <td th:text="${info.getName()}">MyName</td>
        <td th:text="${info.getPhoneNumber()}">MyPhoneNumber</td>
    </tr>
    <tr th:if="${#lists.isEmpty(infoEntries)}">
        <td colspan="3">No entries yet.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
